# Publica el tablero en Cloudflare Pages (observatorio-hybrida.pages.dev) con cada cambio en main.
name: Publicar tablero

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Revisar si hay clave de Cloudflare
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "::notice::Sin CLOUDFLARE_API_TOKEN todavía; se omite la publicación automática (no es un error)."
      - uses: actions/checkout@v4
        if: ${{ env.CF_TOKEN != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.CF_TOKEN != '' }}
        with:
          node-version: 20
          cache: npm
      - if: ${{ env.CF_TOKEN != '' }}
        run: npm ci
      - if: ${{ env.CF_TOKEN != '' }}
        run: npm run build
      - name: Publicar en Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # El ID de cuenta no es secreto (Cloudflare lo muestra en las URL del panel)
          accountId: e125c384485bf0a904a37a6b3707aefc
          command: pages deploy dist --project-name=observatorio-hybrida --branch=main --commit-dirty=true
